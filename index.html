<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        
        #game-canvas {
            width: 100%;
            border: 2px solid #333;
            background-color: #fff;
            display: block;
        }
        
        #score {
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
        }
        
        #start-button {
            margin-top: 10px;
            padding: 12px 24px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #start-button:hover {
            background-color: #45a049;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            width: 80%;
            max-width: 300px;
        }
        
        #controls {
            display: none;
            grid-template-areas:
                ". up ."
                "left down right";
            grid-gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 200px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background-color: #45a049;
        }
        
        #up-btn { grid-area: up; }
        #down-btn { grid-area: down; }
        #left-btn { grid-area: left; }
        #right-btn { grid-area: right; }
        
        @media (max-width: 768px) {
            #controls {
                display: grid;
            }
            
            h1 {
                font-size: 20px;
            }
            
            #score {
                font-size: 18px;
            }
            
            #start-button {
                padding: 10px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <h1>Змейка</h1>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="game-over">
            <h2>Игра окончена!</h2>
            <p id="final-score">Счет: 0</p>
            <button id="restart-button">Играть снова</button>
        </div>
    </div>
    <div id="score">Счет: 0</div>
    <button id="start-button">Начать игру</button>
    
    <div id="controls">
        <button class="control-btn" id="up-btn">↑</button>
        <button class="control-btn" id="left-btn">←</button>
        <button class="control-btn" id="down-btn">↓</button>
        <button class="control-btn" id="right-btn">→</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const startButton = document.getElementById('start-button');
            const gameOverElement = document.getElementById('game-over');
            const finalScoreElement = document.getElementById('final-score');
            const restartButton = document.getElementById('restart-button');
            
           
            function resizeCanvas() {
                const size = Math.min(window.innerWidth - 40, 400);
                canvas.width = size;
                canvas.height = size;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            const gridSize = 20;
            let tileCount = canvas.width / gridSize;
            
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let gameSpeed = 100;
            let gameLoop;
            let gameRunning = false;
            
            function initGame() {
                tileCount = canvas.width / gridSize;
                
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameSpeed = 255;
                scoreElement.textContent = `Счет: ${score}`;
                
                generateFood();
                
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, gameSpeed);
                gameRunning = true;
                gameOverElement.style.display = 'none';
            }
            
            function generateFood() {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        return generateFood();
                    }
                }
            }
            
            function gameStep() {
                moveSnake();
                
                if (checkCollision()) {
                    gameOver();
                    return;
                }
                
                drawGame();
            }
            
            function moveSnake() {
                direction = nextDirection;
                
                const head = {x: snake[0].x, y: snake[0].y};
                
                switch (direction) {
                    case 'up':
                        head.y--;
                        break;
                    case 'down':
                        head.y++;
                        break;
                    case 'left':
                        head.x--;
                        break;
                    case 'right':
                        head.x++;
                        break;
                }
                
                snake.unshift(head);
                
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = `Счет: ${score}`;
                    
                    if (score % 5 === 0) {
                        gameSpeed = Math.max(50, gameSpeed - 10);
                        clearInterval(gameLoop);
                        gameLoop = setInterval(gameStep, gameSpeed);
                    }
                    
                    generateFood();
                } else {
                    snake.pop();
                }
            }
            
            function checkCollision() {
                const head = snake[0];
                
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    return true;
                }
                
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            function gameOver() {
                clearInterval(gameLoop);
                gameRunning = false;
                finalScoreElement.textContent = `Счет: ${score}`;
                gameOverElement.style.display = 'block';
            }
            
            function drawGame() {
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let segment of snake) {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    
                    ctx.strokeStyle = '#45a049';
                    ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                }
                
                const head = snake[0];
                ctx.fillStyle = '#2E7D32';
                ctx.fillRect(head.x * gridSize, head.y * gridSize, gridSize, gridSize);
                
                ctx.fillStyle = '#f44336';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            document.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                
                switch (e.key) {
                    case 'ArrowUp':
                        if (direction !== 'down') nextDirection = 'up';
                        break;
                    case 'ArrowDown':
                        if (direction !== 'up') nextDirection = 'down';
                        break;
                    case 'ArrowLeft':
                        if (direction !== 'right') nextDirection = 'left';
                        break;
                    case 'ArrowRight':
                        if (direction !== 'left') nextDirection = 'right';
                        break;
                }
            });
            
            let touchStartX = 0;
            let touchStartY = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, false);
            
            document.addEventListener('touchend', (e) => {
                if (!gameRunning) return;
                
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && direction !== 'left') {
                        nextDirection = 'right';
                    } else if (dx < 0 && direction !== 'right') {
                        nextDirection = 'left';
                    }
                } else {
                    if (dy > 0 && direction !== 'up') {
                        nextDirection = 'down';
                    } else if (dy < 0 && direction !== 'down') {
                        nextDirection = 'up';
                    }
                }
            }, false);
            
            document.getElementById('up-btn').addEventListener('click', () => {
                if (gameRunning && direction !== 'down') nextDirection = 'up';
            });
            
            document.getElementById('down-btn').addEventListener('click', () => {
                if (gameRunning && direction !== 'up') nextDirection = 'down';
            });
            
            document.getElementById('left-btn').addEventListener('click', () => {
                if (gameRunning && direction !== 'right') nextDirection = 'left';
            });
            
            document.getElementById('right-btn').addEventListener('click', () => {
                if (gameRunning && direction !== 'left') nextDirection = 'right';
            });
            
            startButton.addEventListener('click', initGame);
            
            restartButton.addEventListener('click', initGame);
            
            drawGame();
        });
    </script>
</body>
</html>
